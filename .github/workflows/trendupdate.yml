name: Weekly Trend Update

on:
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 0:00 UTC = 9:00 JST
  workflow_dispatch:       # 手動実行も可

jobs:
  trendupdate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Run trendupdate
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          mode: agent
          anthropic_model: "claude-sonnet-4-6"
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep,LS,WebSearch,WebFetch"
          direct_prompt: |
            GitHubトレンドと公式ドキュメントの最新情報を取得し、knowledge/ を更新してください。

            ## 手順

            ### 1. 前回調査の確認
            `knowledge/trends/latest.md` を読み込んで前回との差分検出基準を把握する。

            ### 2. 並列調査
            以下のソースを同時に調査する:

            **GitHub（gh api で取得）:**
            - `gh api repos/shanraisshan/claude-code-best-practice/contents/README.md --jq '.content' | base64 -d | head -300`
            - `gh api repos/FlorianBruniaux/claude-code-ultimate-guide/contents/README.md --jq '.content' | base64 -d | head -200`
            - `gh api repos/hesreallyhim/awesome-claude-code/contents/README.md --jq '.content' | base64 -d | head -200`
            - `gh api repos/anthropics/claude-code/contents/CHANGELOG.md --jq '.content' | base64 -d | head -300`

            **公式ドキュメント（WebFetch）:**
            - https://code.claude.com/docs/en/best-practices
            - https://code.claude.com/docs/en/sub-agents
            - https://code.claude.com/docs/en/hooks
            - https://code.claude.com/docs/en/memory
            - https://code.claude.com/docs/en/agent-sdk/overview
            - https://code.claude.com/docs/en/agent-sdk/subagents
            - https://code.claude.com/docs/en/agent-teams
            - https://platform.claude.com/docs/en/managed-agents/overview
            - https://code.claude.com/docs/en/mcp
            - https://modelcontextprotocol.io/introduction

            **AI オーケストレーション最適化（既存ソース + 公式ドキュメントから抽出）:**
            上記で取得した資料から AI オーケストレーションに関する記述を抽出する。
            特に以下を抽出する:
            - オーケストレーター / ワーカーの責務分離パターン
            - エージェント間のコンテキスト受け渡し設計
            - 並列 vs 直列の使い分け判断基準
            - ループ・再試行・エスカレーションの設計
            - コスト最適化（タスク別モデル割り当て）

            **CLAUDE.md ベストプラクティス（既存ソース + 公式ドキュメントから抽出）:**
            上記で取得した資料から CLAUDE.md 設計に関する記述を抽出する。
            特に以下を抽出する:
            - CLAUDE.md に書くべき内容と書かない内容の判断基準
            - グローバル（~/.claude/）とプロジェクト（.claude/）の使い分け
            - 効果的なセクション構成・記述スタイル
            - 自動読み込みの仕組みと優先順位

            ### 3. 差分検出・記録
            - 前回調査との差分を検出する
            - `knowledge/trends/YYYY-MM-DD.md` に詳細レポートを保存する（YYYY-MM-DD は本日日付、日本語）
            - `knowledge/trends/latest.md` を今回のレポートで上書きする
            - `knowledge/changelog.md` に差分サマリーを追記する（形式: `## YYYY-MM-DD\n- 差分内容`）

            ### 4. 設計パターン・チェックリストの更新
            - `docs/02_design-patterns.md`（インデックス）の「直近の主要変更」セクションを今回の差分で更新する
            - `docs/patterns/` 配下の各ファイルを今回の調査結果に基づいて更新する：
              - `subagent-design.md`: サブエージェント設計の新情報
              - `hooks.md`: フックパターンの新情報
              - `memory-and-claude-md.md`: メモリ・CLAUDE.md設計の新情報
              - `ai-orchestration.md`: AIオーケストレーションの新情報
              - `mcp-design.md`: MCP設計の新情報
              - `skill-design.md`: スキル設計の新情報
              - `cost-optimization.md`: コスト最適化の新情報
              - `error-recovery.md`: エラーリカバリーの新情報
            - `docs/03_checklist.md` を今回の調査結果に基づいて更新する
            - 変更のないファイルは更新しない

            ## 制約
            - エラーが発生した場合は changelog.md にエラー内容を記録する

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge/ docs/ docs/patterns/
          git diff --cached --quiet || git commit -m "trend: $(date +'%Y-%m-%d') 週次調査"
          git push
